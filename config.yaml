# yaml-language-server: $schema=./node_modules/envio/svm.schema.json
name: midas-solmfone
description: >-
  Midas solmFONE (Token-2022) issuance/redemption lifecycle on Solana —
  mint_vaults + data_feed programs, via HyperSync.
ecosystem: svm
chains:
  - id: solana
    start_block: 393400000
    experimental:
      programs:
        - name: MidasVaults
          program_id: MidasZepq8k2oFNCCm1rm31rbbj68JSPJeXwqQu6NfZ
          idl: ./idl/midas_vaults.json
          instructions:
            - name: mint_request
              discriminator: "0xbf882e24dd9332c1"
            - name: approve_mint_request
              discriminator: "0x76197aacec59274c"
            - name: reject_mint_request
              discriminator: "0x5f8e935516e65f9e"
            - name: mint_instant
              discriminator: "0x06570114f4a18552"
            - name: redeem_request
              discriminator: "0xed1e71de7fe6cbf3"
            - name: approve_redeem_request
              discriminator: "0xd9557216f5ce0214"
            - name: reject_redeem_request
              discriminator: "0x8f2d42b63ea96cd4"
            - name: redeem_instant
              discriminator: "0x7e3f068bd53c109d"
        - name: DataFeed
          program_id: MDF1kkcgJqyizY8k3U1ESAxLBYFYmE3qTwxf2pmGE1s
          idl: ./idl/data_feed.json
          instructions:
            - name: update_feed
              discriminator: "0xde063483ad5171f7"
            - name: update_manual_feed
              discriminator: "0x2a3f6e2314840ce6"
